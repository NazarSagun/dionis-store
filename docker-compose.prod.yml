# Single-host deployment (for example one EC2 instance). Reads ./.env.prod.
# Start:   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Migrate: docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm api pnpm exec prisma migrate deploy
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dionis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: dionis_db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dionis -d dionis_db"]
      interval: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3500
      DATABASE_URL: postgresql://dionis:${POSTGRES_PASSWORD}@db:5432/dionis_db
      ACCESS_TOKEN: ${ACCESS_TOKEN:?set ACCESS_TOKEN}
      REFRESH_TOKEN: ${REFRESH_TOKEN:?set REFRESH_TOKEN}
      CLIENT_URL: ${CLIENT_URL:?set CLIENT_URL}
      # Set false in .env.prod while the site is served over plain HTTP.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # One reverse proxy (Caddy) sits in front of the API.
      TRUST_PROXY: 1
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY, the API does not start without it}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Empty SMTP_HOST turns receipt emails off.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Dionis Store <no-reply@dionis-store.local>}
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # HTTPS in front of both apps. Needs DOMAIN, with a DNS A record that points
  # to this server, and ports 80 and 443 open. See Caddyfile.
  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?set NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  db_data:
  caddy_data:
  caddy_config:
