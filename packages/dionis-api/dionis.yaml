openapi: '3.0.0'
info:
  version: 1.0.0
  title: Swagger Dionis
  license:
    name: MIT
servers:
  - url: http://dionis.swagger.io/v1
paths:
  /users:
    get:
      summary: List all users
      operationId: getUsers
      responses:
        '200':
          description: A paged array of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/usersArray'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authErrorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
  /games/top-deals:
    get:
      summary: List up to 10 games with the highest discount, discount > 0, highest first
      operationId: getGamesTopDeals
      responses:
        '200':
          description: Array of discounted games, highest discount first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/gameObject'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
  /games/{page}:
    get:
      summary: List games in paged format from db
      operationId: getGames
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: integer
            example: 1
          description: The page number to retrieve
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: Case-insensitive title fragment to filter by
        - name: platform
          in: query
          required: false
          schema:
            type: string
            enum: [PC, PS5, Xbox, Switch]
          description: Platform to filter by (matches games whose platform contains this value)
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [price_asc, price_desc, rating_desc]
          description: Sort order to apply before pagination
      responses:
        '200':
          description: Array of games
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gamesArray'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
  /game/{gameId}:
    get:
      summary: Fetch game by id
      operationId: getGame
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
            example: 1
          description: The game id to retrieve
      responses:
        '200':
          description: Game object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gameObject'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
  /user/delete:
    post:
      summary: Delete user
      operationId: deleteUser
      tags:
        - deleteUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: number
                  example: 1
      responses:
        '200':
          description: An object with success message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successMessage'
        '400':
          description: Bad request error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
  /register:
    post:
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userCredentials'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userObject'
        '400':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
  /login:
    post:
      summary: Login an existing user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userCredentials'
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userObject'
        '400':
          description: User does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
  /logout:
    get:
      summary: Logout the current user
      operationId: logout
      responses:
        '200':
          description: User logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
  /refresh:
    get:
      summary: Refresh token
      operationId: refresh
      responses:
        '200':
          description: Refreshed token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userObject'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authErrorMessage'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
components:
  securitySchemes:
    bearerHttpAuthentication:
      description: Bearer token using a JWT
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    errorMessage:
      type: object
      properties:
        message:
          type: string
          example: No token provided
      description: A text message describing an error
    authErrorMessage:
      type: object
      properties:
        message:
          type: string
          example: No token provided
        user:
          type: object
          nullable: true
      description: An object with text message describing an error and nullable user
    userObject:
      type: object
      properties:
        message:
          type: string
          example: User logged in successfully!
        user:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            accessToken:
              type: string
            role:
              type: integer
    successMessage:
      type: object
      properties:
        message:
          type: string
          example: User logged out successfully!
    usersArray:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
          email:
            type: string
            format: email
          name:
            type: string
          password:
            type: string
          refreshToken:
            type: string
            nullable: true
          role:
            type: integer
            enum: [101, 500, 233]
          createdAt:
            type: string
            format: date
    gamesArray:
      type: object
      properties:
        totalPages:
          type: integer
        games:
          type: array
          items:
            $ref: '#/components/schemas/gameObject'
    gameObject:
      type: object
      required:
        - developer
        - discount
        - freetogame_profile_url
        - game_url
        - genre
        - id
        - platform
        - price
        - publisher
        - rating
        - release_date
        - short_description
        - thumbnail
        - title
      properties:
        id:
          type: integer
        title:
          type: string
        thumbnail:
          type: string
        short_description:
          type: string
        game_url:
          type: string
        genre:
          type: string
        platform:
          type: string
        publisher:
          type: string
        developer:
          type: string
        release_date:
          type: string
        freetogame_profile_url:
          type: string
        rating:
          type: string
        price:
          type: number
        discount:
          type: number
    userCredentials:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        name:
          type: string
      required:
        - email
        - password
