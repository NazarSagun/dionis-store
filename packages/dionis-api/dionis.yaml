openapi: '3.0.0'
info:
  version: 1.0.0
  title: Swagger Dionis
  license:
    name: MIT
servers:
  - url: http://dionis.swagger.io/v1
paths:
  /users:
    get:
      summary: List all users
      operationId: getUsers
      responses:
        '200':
          description: A paged array of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/usersArray'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authErrorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
  /users/me:
    patch:
      summary: Update the current user's display name
      operationId: updateName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateNameInput'
      responses:
        '200':
          description: Updated name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateNameResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
  /users/me/password:
    patch:
      summary: Change the current user's password
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/changePasswordInput'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successMessage'
        '400':
          description: Bad request, such as a wrong current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
  /games/top-deals:
    get:
      summary: List up to 10 games with the highest discount, discount > 0, highest first
      operationId: getGamesTopDeals
      responses:
        '200':
          description: Array of discounted games, highest discount first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/gameObject'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
  /games/genres:
    get:
      summary: List every genre with its number of games, alphabetically
      operationId: getGamesGenres
      responses:
        '200':
          description: Genres with counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/genreCount'
  /games/{page}:
    get:
      summary: List games in paged format from db
      operationId: getGames
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: integer
            example: 1
          description: The page number to retrieve
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: Case-insensitive title fragment to filter by
        - name: platform
          in: query
          required: false
          schema:
            type: string
            enum: [PC, PS5, Xbox, Switch]
          description: Platform to filter by (matches games whose platform contains this value)
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [price_asc, price_desc, rating_desc]
          description: Sort order to apply before pagination
        - name: edition
          in: query
          required: false
          schema:
            type: string
            enum: [digital, standard, collector]
          description: Edition to filter by. Digital matches every game; standard/collector match games with a physical edition whose name contains that word.
        - name: genre
          in: query
          required: false
          schema:
            type: string
            maxLength: 50
          description: Exact genre, one of the values from /games/genres
        - name: minPrice
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Lowest discounted price in whole euros, inclusive
        - name: maxPrice
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Highest discounted price in whole euros, inclusive
      responses:
        '200':
          description: Array of games
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gamesArray'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
  /game/{gameId}:
    get:
      summary: Fetch game by id
      operationId: getGame
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
            example: 1
          description: The game id to retrieve
      responses:
        '200':
          description: Game object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gameObject'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
  /user/delete:
    post:
      summary: Delete user
      operationId: deleteUser
      tags:
        - deleteUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: number
                  example: 1
      responses:
        '200':
          description: An object with success message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successMessage'
        '400':
          description: Bad request error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
  /register:
    post:
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userCredentials'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userObject'
        '400':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
  /login:
    post:
      summary: Login an existing user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userCredentials'
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userObject'
        '400':
          description: User does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
  /logout:
    get:
      summary: Logout the current user
      operationId: logout
      responses:
        '200':
          description: User logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
  /orders:
    get:
      summary: List one page of the current user's orders, newest first
      operationId: getOrders
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
      responses:
        '200':
          description: One page of orders and the total count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ordersPage'
        '400':
          description: Invalid page or pageSize
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
  /orders/owned:
    get:
      summary: List each distinct game and edition the current user has bought; editionId is null for a digital copy
      operationId: getOwnedItems
      responses:
        '200':
          description: Owned game and edition pairs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ownedItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
  /orders/payment-intent:
    post:
      summary: Create a Stripe PaymentIntent for the given cart items, server-priced
      operationId: createPaymentIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/orderItemInput'
      responses:
        '201':
          description: Client secret to confirm payment with on the client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/paymentIntentResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
  /orders/confirm:
    post:
      summary: Confirm a succeeded PaymentIntent and create the order, with one activation code per digital game
      operationId: confirmOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - paymentIntentId
              properties:
                paymentIntentId:
                  type: string
      responses:
        '201':
          description: The created (or already-existing) order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orderObject'
        '400':
          description: Payment was not completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
  /orders/payment-intent/{paymentIntentId}/shipping:
    post:
      summary: Store the shipping address on an unpaid PaymentIntent, so the order can be created from it later
      operationId: setShippingAddress
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/shippingAddressInput'
      responses:
        '204':
          description: The address was stored
        '400':
          description: A required field is missing or too long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '404':
          description: The PaymentIntent does not belong to this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '409':
          description: The PaymentIntent is already paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
  /orders/{orderId}:
    get:
      summary: Fetch an order placed by the current user
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            example: 1
          description: The order id to retrieve
      responses:
        '200':
          description: Order object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orderObject'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
  /orders/{orderId}/items/{itemId}/activate:
    patch:
      summary: Mark one purchased game in an order as activated by the user
      operationId: activateOrderItem
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: The updated order item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orderItemObject'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '404':
          description: Order or item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
  /wishlist:
    get:
      summary: List the signed-in player's wishlist, newest first, with current game data
      operationId: getWishlist
      responses:
        '200':
          description: The wishlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wishlistArray'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
  /wishlist/merge:
    post:
      summary: Add a guest wishlist to the account, keeping the account's entry for games already on it
      operationId: mergeWishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/guestWishlistItemInput'
      responses:
        '200':
          description: The merged wishlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wishlistArray'
        '400':
          description: Invalid items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
  /wishlist/{gameId}:
    put:
      summary: Add a game to the wishlist; the discount snapshot is the game's current discount
      operationId: addWishlistItem
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The wishlist after adding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wishlistArray'
        '404':
          description: Game does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
    delete:
      summary: Remove a game from the wishlist
      operationId: removeWishlistItem
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The wishlist after removing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wishlistArray'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
    patch:
      summary: Move a wishlist item's discount snapshot to the game's current discount, after the price-drop badge showed
      operationId: acknowledgeWishlistDiscount
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The wishlist after the update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wishlistArray'
        '404':
          description: Game is not on the wishlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
      security:
        - bearerHttpAuthentication: []
  /refresh:
    get:
      summary: Refresh token
      operationId: refresh
      responses:
        '200':
          description: Refreshed token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userObject'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authErrorMessage'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
components:
  securitySchemes:
    bearerHttpAuthentication:
      description: Bearer token using a JWT
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    errorMessage:
      type: object
      properties:
        message:
          type: string
          example: No token provided
      description: A text message describing an error
    authErrorMessage:
      type: object
      properties:
        message:
          type: string
          example: No token provided
        user:
          type: object
          nullable: true
      description: An object with text message describing an error and nullable user
    userObject:
      type: object
      properties:
        message:
          type: string
          example: User logged in successfully!
        user:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            accessToken:
              type: string
            role:
              type: integer
    successMessage:
      type: object
      properties:
        message:
          type: string
          example: User logged out successfully!
    usersArray:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
          email:
            type: string
            format: email
          name:
            type: string
          password:
            type: string
          refreshToken:
            type: string
            nullable: true
          role:
            type: integer
            enum: [101, 500, 233]
          createdAt:
            type: string
            format: date
    gamesArray:
      type: object
      properties:
        totalPages:
          type: integer
        games:
          type: array
          items:
            $ref: '#/components/schemas/gameObject'
    gameObject:
      type: object
      required:
        - developer
        - discount
        - freetogame_profile_url
        - game_url
        - genre
        - id
        - platform
        - price
        - publisher
        - rating
        - release_date
        - short_description
        - thumbnail
        - title
      properties:
        id:
          type: integer
        title:
          type: string
        thumbnail:
          type: string
        short_description:
          type: string
        game_url:
          type: string
        genre:
          type: string
        platform:
          type: string
        publisher:
          type: string
        developer:
          type: string
        release_date:
          type: string
        freetogame_profile_url:
          type: string
        rating:
          type: string
        price:
          type: number
        discount:
          type: number
        editions:
          type: array
          items:
            $ref: '#/components/schemas/gameEditionObject'
    gameEditionObject:
      type: object
      required:
        - id
        - name
        - price
        - discount
        - stock
        - description
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: integer
        discount:
          type: integer
        stock:
          type: integer
        description:
          type: string
    orderItemInput:
      type: object
      required:
        - gameId
        - quantity
      properties:
        gameId:
          type: integer
        quantity:
          type: integer
        editionId:
          type: integer
          nullable: true
          description: A physical edition's id, or omitted/null for the digital purchase
    paymentIntentResponse:
      type: object
      properties:
        paymentIntentId:
          type: string
        clientSecret:
          type: string
        amount:
          type: integer
          description: Amount in cents, matching what Stripe charges
    orderItemObject:
      type: object
      properties:
        id:
          type: integer
        gameId:
          type: integer
        editionId:
          type: integer
          nullable: true
        quantity:
          type: integer
        price:
          type: integer
          description: Unit price actually charged, in cents
        activationCode:
          type: string
          nullable: true
          description: Null for a physical edition purchase - there is nothing to redeem
        activated:
          type: boolean
        activatedAt:
          type: string
          format: date-time
          nullable: true
        game:
          $ref: '#/components/schemas/gameObject'
        edition:
          $ref: '#/components/schemas/gameEditionObject'
          nullable: true
    ordersPage:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/orderObject'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    ownedItem:
      type: object
      required:
        - gameId
        - editionId
      properties:
        gameId:
          type: integer
        editionId:
          type: integer
          nullable: true
    updateNameInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    updateNameResponse:
      type: object
      properties:
        name:
          type: string
    changePasswordInput:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    orderObject:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        totalPrice:
          type: integer
          description: Total actually charged, in cents, including the shipping fee if any item is a physical edition
        stripePaymentIntentId:
          type: string
        shippingName:
          type: string
          nullable: true
        shippingLine1:
          type: string
          nullable: true
        shippingLine2:
          type: string
          nullable: true
        shippingCity:
          type: string
          nullable: true
        shippingPostalCode:
          type: string
          nullable: true
        shippingCountry:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/orderItemObject'
    shippingAddressInput:
      type: object
      required:
        - shippingName
        - shippingLine1
        - shippingCity
        - shippingPostalCode
        - shippingCountry
      properties:
        shippingName:
          type: string
        shippingLine1:
          type: string
        shippingLine2:
          type: string
        shippingCity:
          type: string
        shippingPostalCode:
          type: string
        shippingCountry:
          type: string
    wishlistItemObject:
      type: object
      required:
        - gameId
        - discountSnapshot
        - createdAt
