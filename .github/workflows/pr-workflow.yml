name: Build and Test on PR

# Triggers the workflow on pull request events
on:
  pull_request:
    branches:
      - main

# The jobs only read the code. Nothing here pushes, comments, or deploys.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from the root package.json `packageManager` field.
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.5'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test web
        run: pnpm test --filter web

      - name: Test api
        run: pnpm test --filter api

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # No password: the database exists only inside this job and only
          # listens on the runner.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dionis_store_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Catches the receipt emails. SMTP on 1025, HTTP API on 8025.
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025

    # The two Stripe keys come from repository secrets and must be test-mode
    # keys. The JWT signing keys are generated per run in a step below.
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/dionis_store_e2e
      CLIENT_URL: http://localhost:3000
      # The tests sign up many users from one address, so the rate limit is off.
      RATE_LIMIT: off
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAIL_FROM: Dionis Store <no-reply@dionis-store.local>
      E2E_MAIL_API_URL: http://localhost:8025
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_BASE_URL: http://localhost:3500
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      SEED_API_URL: http://localhost:3500/api
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:3500
      E2E_ADMIN_EMAIL: seed-admin@dionis-store.local
      E2E_ADMIN_PASSWORD: seed-admin-password
      SEED_ADMIN_EMAIL: seed-admin@dionis-store.local
      SEED_ADMIN_PASSWORD: seed-admin-password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.5'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate JWT signing keys
        run: |
          for name in ACCESS_TOKEN REFRESH_TOKEN; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Apply database migrations
        run: pnpm --filter api migrate:deploy

      - name: Build
        run: pnpm build

      - name: Start API and web app
        run: |
          # PORT is set per process: `next start` reads PORT too, so a
          # job-level value would put both apps on the same port.
          PORT=3500 pnpm --filter api start > api.log 2>&1 &
          PORT=3000 pnpm --filter web start > web.log 2>&1 &
          for url in "$E2E_API_URL" "$E2E_BASE_URL"; do
            for i in $(seq 1 60); do
              curl -sf "$url" > /dev/null && break
              if [ "$i" = 60 ]; then echo "$url did not start"; exit 1; fi
              sleep 2
            done
          done

      - name: Seed games
        run: pnpm --filter api seed:api

      - name: Install Playwright browser
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @repo/e2e test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report
            api.log
            web.log
          retention-days: 7
