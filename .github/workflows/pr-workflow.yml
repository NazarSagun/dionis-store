name: Build and Test on PR

# Triggers the workflow on pull request events
on:
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Reads the pnpm version from the root package.json `packageManager` field.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21.7.3'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test web
        run: pnpm test --filter web

      - name: Test api
        run: pnpm test --filter api

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dionis_store_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Values for a database that exists only for this job. The two Stripe keys
    # come from repository secrets and must be test-mode keys.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dionis_store_e2e
      ACCESS_TOKEN: ci-access-token-secret
      REFRESH_TOKEN: ci-refresh-token-secret
      CLIENT_URL: http://localhost:3000
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_BASE_URL: http://localhost:3500
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      SEED_API_URL: http://localhost:3500/api
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:3500

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21.7.3'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Apply database migrations
        run: pnpm --filter api migrate:deploy

      - name: Build
        run: pnpm build

      - name: Start API and web app
        run: |
          # PORT is set per process: `next start` reads PORT too, so a
          # job-level value would put both apps on the same port.
          PORT=3500 pnpm --filter api start > api.log 2>&1 &
          PORT=3000 pnpm --filter web start > web.log 2>&1 &
          for url in "$E2E_API_URL" "$E2E_BASE_URL"; do
            for i in $(seq 1 60); do
              curl -sf "$url" > /dev/null && break
              if [ "$i" = 60 ]; then echo "$url did not start"; exit 1; fi
              sleep 2
            done
          done

      - name: Seed games
        run: pnpm --filter api seed:api

      - name: Install Playwright browser
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @repo/e2e test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report
            api.log
            web.log
          retention-days: 7
